name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://example.vercel.app
          NEXT_PUBLIC_API_URL: https://example.railway.app/api

      - name: Build backend
        run: npm run build:backend

      - name: Build admin
        run: npm run build --workspace=admin
        env:
          NEXT_PUBLIC_API_URL: https://example.railway.app
